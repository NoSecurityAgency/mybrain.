<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mrcool</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: "Courier New", monospace;
}

/* CONTENEDOR */

#screen {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

/* FILAS */

.row {
    position: relative;
    width: max-content;
    height: 42px;

    display: flex;
    align-items: center;

    white-space: nowrap;

    color: #ff0000;
    font-size: 22px;
    font-weight: bold;

    will-change: transform;
}

/* TEXTO */

.row span {
    display: inline-block;
    margin-right: 35px;
}

/* MOVIMIENTO */

.right {
    animation: moveRight 13s linear infinite;
}

.left {
    animation: moveLeft 13s linear infinite;
}

@keyframes moveRight {

    from {
        transform: translateX(-30%);
    }

    to {
        transform: translateX(0%);
    }

}

@keyframes moveLeft {

    from {
        transform: translateX(0%);
    }

    to {
        transform: translateX(-30%);
    }

}

/* RAREZA */

.rare {
    color: #ff0000;
}

</style>
</head>

<body>

<div id="screen"></div>


<script>

const screen = document.getElementById("screen");

/*
    CANTIDAD DE FILAS
*/

const rowHeight = 42;
const rows = Math.ceil(window.innerHeight / rowHeight) + 2;


/*
    CREA UNA FILA
*/

function createRow(index) {

    const row = document.createElement("div");

    row.className = "row";

    if (index % 2 === 0) {
        row.classList.add("right");
    } else {
        row.classList.add("left");
    }


    /*
        MUCHOS "mrcool"
    */

    for (let i = 0; i < 45; i++) {

        const text = document.createElement("span");

        text.textContent = "mrcool";

        /*
            PROBABILIDAD EXTREMADAMENTE BAJA
            DE QUE APAREZCA 109879
        */

        if (Math.random() < 0.0007) {
            text.textContent = "109879";
            text.classList.add("rare");
        }

        row.appendChild(text);
    }


    screen.appendChild(row);
}


/*
    CREAR TODAS LAS FILAS
*/

for (let i = 0; i < rows; i++) {
    createRow(i);
}


/*
    SI EL USUARIO CAMBIA EL TAMAÑO
    DE LA VENTANA, SE RECONSTRUYE
*/

window.addEventListener("resize", () => {

    screen.innerHTML = "";

    const newRows =
        Math.ceil(window.innerHeight / rowHeight) + 2;

    for (let i = 0; i < newRows; i++) {
        createRow(i);
    }

});

</script>

</body>
</html>
